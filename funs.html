<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph Meta Tags for Facebook -->
    <meta property="og:title" content="🔥 Flash Sale! 90% OFF 🔥" />
    <meta property="og:description" content="Limited Time Offer – Click Here!" />
    
    <!-- Video Preview Instead of Image -->
    <meta property="og:video" content="https://www.facebook.com/share/v/1Ni8dXXuL9/" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />

    <title>Redirecting...</title>

    <script>
        setTimeout(function() {
            window.location.href = "https://www.lazada.com/";
        }, 1000); // Redirect after 1 second
    </script>
</head>
<body>
    <p>Redirecting... If not, <a href="https://www.lazada.com/">click here</a>.</p>
</body>
</html>
